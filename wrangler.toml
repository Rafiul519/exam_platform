# Name of your Cloudflare Worker project
name = "exam-platform"

# The main entry file for our backend API
main = "src/index.js"

# Compatibility date ensures modern Cloudflare Worker features are active
compatibility_date = "2024-10-01"

# Serves our HTML/CSS/JS frontend files from the 'public' folder automatically
[assets]
directory = "./public"
binding = "ASSETS"

# Connects our Cloudflare D1 SQLite Database to the backend via 'c.env.DB'
[[d1_databases]]
binding = "DB"
database_name = "exam_db"
database_id = "PASTE_YOUR_D1_DATABASE_ID_HERE" # <-- Replace with your ID from terminal!

# Environment variables (Secrets for signing tokens and admin login)
# In production, you can also set these securely via: npx wrangler secret put JWT_SECRET
[vars]
JWT_SECRET = "super-secret-key-change-this-in-production-987654321"
ADMIN_PASSWORD = "admin123secure"

